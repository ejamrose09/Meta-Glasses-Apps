<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>True Count</title>

  <style>
    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      outline: none;
    }

    .screen {
      position: relative;
      width: 600px;
      height: 600px;
      max-width: 100vw;
      max-height: 100vh;
      margin: auto;
      padding: 24px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 34px;
      letter-spacing: 4px;
    }

    .setup-section {
      width: 100%;
      padding: 10px 0;
      opacity: 0.38;
      transition: opacity 120ms ease;
    }

    .setup-section.active {
      opacity: 1;
    }

    .setup-label {
      margin-bottom: 8px;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .selection-options {
      display: flex;
      justify-content: center;
      gap: 24px;
    }

    .selection-option {
      width: 150px;
      height: 105px;
      border: 4px solid #666;
      border-radius: 20px;
      background: #111;
      color: #fff;
      font-size: 52px;
      font-weight: 700;
      line-height: 1;
      outline: none;
    }

    .selection-option.selected {
      border-color: #fff;
      background: #333;
    }

    .option-label {
      display: block;
      margin-top: 7px;
      font-size: 15px;
      font-weight: 400;
    }

    .selection-help {
      margin-top: 16px;
      font-size: 18px;
      line-height: 1.4;
      color: #ddd;
    }

    .counter-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 18px;
      color: #ddd;
    }

    .main-values {
      width: 100%;
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
      gap: 6px;
    }

    .value-panel {
      min-width: 0;
      overflow: visible;
    }

    .value-label {
      margin-bottom: 15px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .value {
      font-size: 50px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    #cardsDealt {
      transform: scaleX(0.68);
    }

    #betAmount {
      font-size: 46px;
      transform: scaleX(0.90);
    }

    #trueCount {
      transform: scaleX(0.85);
    }

    .counter-footer {
      width: 100%;
      font-size: 18px;
      line-height: 1.5;
      color: #ddd;
    }

    .gesture-flash {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 25px;
      border: 12px solid transparent;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 3px;
      opacity: 0;
      pointer-events: none;
    }

    .gesture-flash.show {
      border-color: #fff;
      background: rgba(255, 255, 255, 0.12);
      opacity: 1;
    }
  </style>
</head>

<body tabindex="0">
  <!-- Both startup choices remain visible on one screen for Meta Display. -->
  <main id="setupScreen" class="screen">
    <h1>GAME SETUP</h1>

    <section id="deckSection" class="setup-section active">
      <div class="setup-label"># OF DECKS</div>
      <div class="selection-options">
        <button
          class="selection-option deck-option selected"
          data-decks="2"
          type="button"
          tabindex="-1"
          aria-pressed="true"
        >
          2
          <span class="option-label">DECKS</span>
        </button>

        <button
          class="selection-option deck-option"
          data-decks="6"
          type="button"
          tabindex="-1"
          aria-pressed="false"
        >
          6
          <span class="option-label">DECKS</span>
        </button>
      </div>
    </section>

    <section id="minimumSection" class="setup-section">
      <div class="setup-label">TABLE MINIMUM</div>
      <div class="selection-options">
        <button
          class="selection-option minimum-option selected"
          data-minimum="15"
          type="button"
          tabindex="-1"
          aria-pressed="true"
        >
          $15
          <span class="option-label">MINIMUM</span>
        </button>

        <button
          class="selection-option minimum-option"
          data-minimum="25"
          type="button"
          tabindex="-1"
          aria-pressed="false"
        >
          $25
          <span class="option-label">MINIMUM</span>
        </button>
      </div>
    </section>

    <div id="setupHelp" class="selection-help">
      Select decks with left or right<br>
      Index tap for table minimum
    </div>
  </main>

  <main id="counterScreen" class="screen" hidden>
    <div class="counter-header">
      <span><strong id="deckCount">2</strong> decks</span>
      <span>Minimum: <strong id="tableMinimum">$15</strong></span>
      <span>
        Remaining:
        <strong id="decksRemaining">2.00</strong>
      </span>
    </div>

    <div class="main-values">
      <section class="value-panel">
        <div class="value-label">CARDS</div>
        <div id="cardsDealt" class="value">0/104</div>
      </section>

      <section class="value-panel">
        <div class="value-label">RUNNING</div>
        <div id="runningCount" class="value">0</div>
      </section>

      <section class="value-panel">
        <div class="value-label">BET</div>
        <div id="betAmount" class="value">$0</div>
      </section>

      <section class="value-panel">
        <div class="value-label">TRUE</div>
        <div id="trueCount" class="value">0.0</div>
      </section>
    </div>

    <div class="counter-footer">
      Right: +1 &nbsp; Left: −1<br>
      Down: neutral &nbsp; Tap: reset
    </div>

    <div
      id="gestureFlash"
      class="gesture-flash"
      aria-hidden="true"
    ></div>
  </main>

  <script>
    "use strict";

    let selectedDecks = 2;
    let selectedMinimum = 15;
    let totalCards = 104;
    let runningCount = 0;
    let cardsDealt = 0;

    let currentScreen = "setup";
    let setupStep = "decks";
    let screenShownAt = 0;
    let suppressClicksUntil = 0;
    let resetEnabledAt = 0;
    let flashTimer = null;

    const ACTIVATION_LOCK_MS = 400;
    const SYNTHETIC_CLICK_GUARD_MS = 650;

    // Meta Display may emit both a click and an Enter event for one tap.
    // Keep reset disarmed briefly after entering the counter so the
    // setup-confirmation tap cannot immediately call resetShoe().
    const RESET_ARM_DELAY_MS = 1500;

    const setupScreen =
      document.getElementById("setupScreen");

    const counterScreen =
      document.getElementById("counterScreen");

    const deckSection =
      document.getElementById("deckSection");

    const minimumSection =
      document.getElementById("minimumSection");

    const setupHelp =
      document.getElementById("setupHelp");

    const deckOptions =
      document.querySelectorAll(".deck-option");

    const minimumOptions =
      document.querySelectorAll(".minimum-option");

    const deckCountDisplay =
      document.getElementById("deckCount");

    const tableMinimumDisplay =
      document.getElementById("tableMinimum");

    const runningCountDisplay =
      document.getElementById("runningCount");

    const trueCountDisplay =
      document.getElementById("trueCount");

    const betAmountDisplay =
      document.getElementById("betAmount");

    const decksRemainingDisplay =
      document.getElementById("decksRemaining");

    const cardsDealtDisplay =
      document.getElementById("cardsDealt");

    const gestureFlash =
      document.getElementById("gestureFlash");

    function formatSignedNumber(value, decimalPlaces) {
      if (Math.abs(value) < 0.0001) {
        value = 0;
      }

      const formatted = value.toFixed(decimalPlaces);
      return value > 0 ? "+" + formatted : formatted;
    }

    function activationIsLocked() {
      return Date.now() - screenShownAt < ACTIVATION_LOCK_MS;
    }

    function guardAgainstSyntheticClick() {
      suppressClicksUntil =
        Date.now() + SYNTHETIC_CLICK_GUARD_MS;
    }

    function markStepChanged() {
      screenShownAt = Date.now();
      document.body.focus();
    }

    function updateDeckSelection() {
      deckOptions.forEach(function (button) {
        const isSelected =
          Number(button.dataset.decks) === selectedDecks;

        button.classList.toggle("selected", isSelected);
        button.setAttribute("aria-pressed", String(isSelected));
      });
    }

    function updateMinimumSelection() {
      minimumOptions.forEach(function (button) {
        const isSelected =
          Number(button.dataset.minimum) === selectedMinimum;

        button.classList.toggle("selected", isSelected);
        button.setAttribute("aria-pressed", String(isSelected));
      });
    }

    function updateSetupStep() {
      const choosingDecks = setupStep === "decks";

      deckSection.classList.toggle("active", choosingDecks);
      minimumSection.classList.toggle("active", !choosingDecks);

      setupHelp.innerHTML = choosingDecks
        ? "Select decks with left or right<br>Index tap for table minimum"
        : "Select minimum with left or right<br>Index tap to start";

      markStepChanged();
    }

    function flashGesture(message) {
      clearTimeout(flashTimer);
      gestureFlash.textContent = message;
      gestureFlash.classList.remove("show");
      void gestureFlash.offsetWidth;
      gestureFlash.classList.add("show");

      flashTimer = setTimeout(function () {
        gestureFlash.classList.remove("show");
      }, 300);
    }

    function calculateBetAmount(trueCount) {
      if (trueCount === null || trueCount <= 0) {
        return 0;
      }

      // Use the same one-decimal value shown in the TRUE column.
      const displayedTrueCount =
        Number(trueCount.toFixed(1));

      const rawBet =
        selectedMinimum * displayedTrueCount;

      // Keep the demonstration amount in $5 increments.
      return Math.max(0, Math.round(rawBet / 5) * 5);
    }

    function updateCounterDisplay() {
      const remainingCards =
        Math.max(totalCards - cardsDealt, 0);

      const decksRemaining = remainingCards / 52;
      const trueCount = decksRemaining > 0
        ? runningCount / decksRemaining
        : null;
      const betAmount = calculateBetAmount(trueCount);

      deckCountDisplay.textContent = selectedDecks;
      tableMinimumDisplay.textContent = "$" + selectedMinimum;
      cardsDealtDisplay.textContent =
        cardsDealt + "/" + totalCards;
      runningCountDisplay.textContent =
        formatSignedNumber(runningCount, 0);
      betAmountDisplay.textContent = "$" + betAmount;
      trueCountDisplay.textContent = trueCount === null
        ? "—"
        : formatSignedNumber(trueCount, 1);
      decksRemainingDisplay.textContent =
        decksRemaining.toFixed(2);
    }

    function startCounter() {
      totalCards = selectedDecks * 52;
      runningCount = 0;
      cardsDealt = 0;
      currentScreen = "counter";
      resetEnabledAt = Date.now() + RESET_ARM_DELAY_MS;

      setupScreen.hidden = true;
      counterScreen.hidden = false;
      updateCounterDisplay();
      markStepChanged();
      flashGesture("START");
    }

    function resetShoe() {
      runningCount = 0;
      cardsDealt = 0;
      updateCounterDisplay();
      flashGesture("RESET");
    }

    function recordCard(countValue) {
      if (cardsDealt >= totalCards) {
        flashGesture("SHOE COMPLETE");
        return false;
      }

      runningCount += countValue;
      cardsDealt += 1;
      updateCounterDisplay();
      return true;
    }

    function handleSetupInput(key) {
      if (setupStep === "decks") {
        if (key === "ArrowLeft") {
          selectedDecks = 2;
          updateDeckSelection();
          return true;
        }

        if (key === "ArrowRight") {
          selectedDecks = 6;
          updateDeckSelection();
          return true;
        }

        if (key === "Enter") {
          if (activationIsLocked()) {
            return true;
          }

          guardAgainstSyntheticClick();
          setupStep = "minimum";
          updateSetupStep();
          return true;
        }
      } else {
        if (key === "ArrowLeft") {
          selectedMinimum = 15;
          updateMinimumSelection();
          return true;
        }

        if (key === "ArrowRight") {
          selectedMinimum = 25;
          updateMinimumSelection();
          return true;
        }

        if (key === "Enter") {
          if (activationIsLocked()) {
            return true;
          }

          guardAgainstSyntheticClick();
          startCounter();
          return true;
        }
      }

      return false;
    }

    function handleCounterInput(key) {
      if (key === "ArrowRight") {
        if (recordCard(1)) {
          flashGesture("+1");
        }
        return true;
      }

      if (key === "ArrowLeft") {
        if (recordCard(-1)) {
          flashGesture("−1");
        }
        return true;
      }

      if (key === "ArrowDown") {
        if (recordCard(0)) {
          flashGesture("NEUTRAL");
        }
        return true;
      }

      if (key === "Enter") {
        // Consume duplicate activation events from the setup tap.
        // A deliberate reset tap works normally after the short delay.
        if (Date.now() < resetEnabledAt) {
          return true;
        }

        resetShoe();
        return true;
      }

      return false;
    }

    document.addEventListener("keydown", function (event) {
      if (event.repeat) {
        return;
      }

      const handled = currentScreen === "setup"
        ? handleSetupInput(event.key)
        : handleCounterInput(event.key);

      if (handled) {
        event.preventDefault();
        event.stopPropagation();
      }
    });

    deckOptions.forEach(function (button) {
      button.addEventListener("click", function (event) {
        event.preventDefault();

        if (
          currentScreen !== "setup" ||
          setupStep !== "decks" ||
          activationIsLocked() ||
          Date.now() < suppressClicksUntil
        ) {
          return;
        }

        selectedDecks = Number(button.dataset.decks);
        updateDeckSelection();
        setupStep = "minimum";
        updateSetupStep();
      });
    });

    minimumOptions.forEach(function (button) {
      button.addEventListener("click", function (event) {
        event.preventDefault();

        if (
          currentScreen !== "setup" ||
          setupStep !== "minimum" ||
          activationIsLocked() ||
          Date.now() < suppressClicksUntil
        ) {
          return;
        }

        selectedMinimum = Number(button.dataset.minimum);
        updateMinimumSelection();
        startCounter();
      });
    });

    document.addEventListener("click", function () {
      window.setTimeout(function () {
        document.body.focus();
      }, 0);
    });

    window.addEventListener("load", function () {
      selectedDecks = 2;
      selectedMinimum = 15;
      currentScreen = "setup";
      setupStep = "decks";
      resetEnabledAt = 0;

      setupScreen.hidden = false;
      counterScreen.hidden = true;

      updateDeckSelection();
      updateMinimumSelection();
      updateSetupStep();

      screenShownAt = Date.now() - ACTIVATION_LOCK_MS;
      document.body.focus();
    });
  </script>
</body>
</html>
